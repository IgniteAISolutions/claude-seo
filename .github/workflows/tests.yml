name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is the floor declared in README/INSTALLATION; test it and current.
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run test suite
        run: python -m pytest tests/ -q

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON files parse
        run: |
          python - <<'PY'
          import json, pathlib, sys
          failed = False
          for p in [pathlib.Path(".claude-plugin/plugin.json"),
                    pathlib.Path("schema/templates.json"),
                    pathlib.Path("extensions/dataforseo/field-config.json")]:
              if not p.exists():
                  print(f"skip (absent): {p}")
                  continue
              try:
                  json.loads(p.read_text())
                  print(f"ok: {p}")
              except json.JSONDecodeError as e:
                  print(f"FAIL: {p}: {e}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Plugin manifest lists every agent and skill on disk
        run: |
          python - <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path(".claude-plugin/plugin.json").read_text())
          failed = False

          on_disk = sorted(str(p) for p in pathlib.Path("agents").glob("*.md"))
          listed = sorted(m.get("agents", []))
          if on_disk != listed:
              print(f"FAIL agents mismatch\n  on disk: {on_disk}\n  listed : {listed}")
              failed = True
          else:
              print(f"ok: {len(listed)} agents match")

          for entry in m.get("skills", []) + m.get("agents", []):
              if not pathlib.Path(entry).exists():
                  print(f"FAIL: manifest references missing file: {entry}")
                  failed = True
          sys.exit(1 if failed else 0)
          PY

      - name: Python files compile
        run: python -m compileall -q hooks scripts tests
